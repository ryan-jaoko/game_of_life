<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Full Screen Page</title>
    <style>
        /* This CSS ensures the page uses the full screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1200px; /* Limits width on large monitors for readability */
            margin: 0 auto;    /* Centers the content */
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>This page is responsive</h1>
        <p>It will adjust its width based on your device's screen size.</p>
    </div>

</body>
</html>
